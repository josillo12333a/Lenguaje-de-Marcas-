    <body>
        <center><H1>Eso era amor</H1> <h3>Angel Gonzalez</h3></center>
        <HR>
        <P>Le comenté:
        —Me entusiasman tus ojos.</P>
        <p>Y ella dijo:
        - ¿Te gustan solos o con rímel?</p>
        <P>- Grandes,
        respondí sin dudar.</P>
        <P>Y también sin dudar
        me los dejó en un plato y se fue a tientas.</P>
